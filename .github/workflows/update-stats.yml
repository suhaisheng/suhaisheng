name: Update profile statistics

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_stats.py
      - .github/workflows/update-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate and validate the card
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_stats.py
      - name: Commit updated statistics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-stats.svg assets/star-counts.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update profile statistics'
          git push
